<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Driver Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        /* Custom styles to refine the look */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<div class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Driver Portal</h2>
<div class="flex w-12 items-center justify-end">
<p class="text-primary text-base font-bold leading-normal tracking-[0.015em] shrink-0 cursor-pointer">Help</p>
</div>
</div>
<!-- Spacing -->
<div class="h-5"></div>
<!-- Main Content Container -->
<div class="flex-1 flex flex-col px-6">
<!-- Logo / Icon Area -->
<div class="flex justify-center pb-6">
<div class="flex h-20 w-20 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20">
<span class="material-symbols-outlined text-primary text-[40px]">local_shipping</span>
</div>
</div>
<!-- Headline -->
<h1 class="text-slate-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center pb-2">Welcome Back</h1>
<!-- Subheadline -->
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-normal text-center pb-8">Sign in to manage your deliveries</p>
<!-- Form Fields -->
<div class="space-y-5">
<!-- Username/Email Field -->
<div class="group">
<label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white mb-2" for="email">Username or Email</label>
<div class="relative rounded-lg shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-slate-400 text-[20px]">mail</span>
</div>
<input class="block w-full rounded-lg border-0 py-3 pl-10 pr-3 text-slate-900 dark:text-white ring-1 ring-inset ring-slate-300 dark:ring-slate-700 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:ring-2 focus:ring-inset focus:ring-primary bg-white dark:bg-[#1c2630] sm:text-sm sm:leading-6" id="email" name="email" placeholder="driver@delivery.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="group">
<label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white mb-2" for="password">Password</label>
<div class="relative rounded-lg shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-slate-400 text-[20px]">lock</span>
</div>
<input class="block w-full rounded-lg border-0 py-3 pl-10 pr-10 text-slate-900 dark:text-white ring-1 ring-inset ring-slate-300 dark:ring-slate-700 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:ring-2 focus:ring-inset focus:ring-primary bg-white dark:bg-[#1c2630] sm:text-sm sm:leading-6" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer">
<span class="material-symbols-outlined text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 text-[20px]">visibility</span>
</div>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-1">
<a class="text-sm font-semibold text-primary hover:text-blue-500" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<div class="pt-4">
<button class="flex w-full justify-center rounded-lg bg-primary px-3 py-3.5 text-sm font-bold leading-6 text-white shadow-sm hover:bg-blue-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors" type="button">
                    Log In
                </button>
</div>
</div>
<!-- Divider -->
<div class="relative mt-10">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
</div>
<div class="relative flex justify-center text-sm font-medium leading-6">
<span class="bg-background-light dark:bg-background-dark px-6 text-slate-500 dark:text-slate-400">Or continue with</span>
</div>
</div>
<!-- Social Login / Biometric Alternative -->
<div class="mt-6 grid grid-cols-2 gap-4">
<a class="flex w-full items-center justify-center gap-3 rounded-lg bg-white dark:bg-[#1c2630] px-3 py-3 text-slate-900 dark:text-white ring-1 ring-inset ring-slate-300 dark:ring-slate-700 hover:bg-slate-50 dark:hover:bg-[#25303b] focus-visible:ring-transparent" href="#">
<span class="material-symbols-outlined text-[20px]">fingerprint</span>
<span class="text-sm font-semibold leading-6">Face ID</span>
</a>
<a class="flex w-full items-center justify-center gap-3 rounded-lg bg-white dark:bg-[#1c2630] px-3 py-3 text-slate-900 dark:text-white ring-1 ring-inset ring-slate-300 dark:ring-slate-700 hover:bg-slate-50 dark:hover:bg-[#25303b] focus-visible:ring-transparent" href="#">
<span class="material-symbols-outlined text-[20px]">qr_code_scanner</span>
<span class="text-sm font-semibold leading-6">Scan Badge</span>
</a>
</div>
</div>
<!-- Bottom Spacing for safe area on mobile -->
<div class="h-8 w-full bg-background-light dark:bg-background-dark"></div>
</div>
</body></html>
